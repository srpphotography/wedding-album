<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipbook</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #222;
    font-family: Arial, sans-serif;
}

/* Main flipbook area */
#book {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 2500px;
}

/* Each physical page */
.page {
    position: absolute;

    width: min(48vw, 650px);
    height: min(88vh, 950px);

    background: #fff;

    transform-origin: left center;

    transform-style: preserve-3d;

    transition:
        transform 0.9s cubic-bezier(.2,.7,.2,1);

    box-shadow:
        0 8px 30px rgba(0,0,0,.45);

    overflow: hidden;

    backface-visibility: hidden;
}

/*
    12x18 page:
    Ratio = 2:3
*/
.page.single {
    aspect-ratio: 2 / 3;
}

/*
    12x36 spread:
    Whole spread ratio = 1:3

    But the spread is displayed as two
    exact 12x18 halves.
*/
.spread {
    position: absolute;

    width: min(96vw, 1300px);
    height: min(88vh, 950px);

    display: flex;

    background: white;

    box-shadow:
        0 8px 30px rgba(0,0,0,.45);

    transform-style: preserve-3d;
}

/* Each half of 12x36 */
.half {
    width: 50%;
    height: 100%;

    position: relative;

    overflow: hidden;

    background: white;
}

/*
    IMPORTANT:
    Image is NEVER stretched.
*/
.half img,
.page.single img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position: center center;

    display: block;
}

/* Center folding line */
.spread::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 1px;
    height: 100%;

    background: rgba(0,0,0,.18);

    transform: translateX(-50%);

    pointer-events: none;
}

/* Page turn */
.turning {
    transform:
        rotateY(-180deg);
}

/* Controls */
#controls {
    position: fixed;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    z-index: 9999;

    display: flex;
    gap: 10px;
}

button {
    border: none;

    background: rgba(0,0,0,.75);
    color: white;

    padding: 12px 22px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;
}

button:hover {
    background: rgba(255,255,255,.2);
}

#pageNumber {
    position: fixed;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    background: rgba(0,0,0,.65);

    padding: 7px 15px;

    border-radius: 20px;

    z-index: 9999;
}
</style>
</head>

<body>

<div id="book"></div>

<div id="pageNumber">
    Page 1
</div>

<div id="controls">
    <button onclick="previousPage()">◀ Previous</button>
    <button onclick="nextPage()">Next ▶</button>
</div>

<script>

/*
=========================================================
                    YOUR PAGES
=========================================================

Put your page images here.

IMPORTANT:

12x18 = one image

12x36 = one WIDE image

Example:

{
    type: "single",
    image: "pages/page1.jpg"
}

and

{
    type: "spread",
    image: "pages/page2-3.jpg"
}

=========================================================
*/

const pages = [

    {
        type: "single",
        image: "pages/page1.jpg"
    },

    {
        type: "spread",
        image: "pages/page2-3.jpg"
    },

    {
        type: "spread",
        image: "pages/page4-5.jpg"
    },

    {
        type: "single",
        image: "pages/page6.jpg"
    },

    {
        type: "spread",
        image: "pages/page7-8.jpg"
    }

];


/*
=========================================================
                FLIPBOOK ENGINE
=========================================================
*/

const book = document.getElementById("book");
const pageNumber = document.getElementById("pageNumber");

let currentPage = 0;
let busy = false;


/*
---------------------------------------------------------
Create Single 12x18 page
---------------------------------------------------------
*/

function createSinglePage(item, index) {

    const page = document.createElement("div");

    page.className = "page single";

    page.dataset.index = index;

    const img = document.createElement("img");

    img.src = item.image;

    img.draggable = false;

    page.appendChild(img);

    book.appendChild(page);

    return page;
}


/*
---------------------------------------------------------
Create 12x36 spread

The image is split EXACTLY at 50%.

Left half = first 12x18

Right half = second 12x18

No stretching.
No cropping.
---------------------------------------------------------
*/

function createSpread(item, index) {

    const spread = document.createElement("div");

    spread.className = "spread";

    spread.dataset.index = index;


    /*
        LEFT HALF
    */

    const left = document.createElement("div");

    left.className = "half";

    const leftImg = document.createElement("img");

    leftImg.src = item.image;

    leftImg.draggable = false;

    /*
        The complete image is positioned
        inside the half.

        Important:
        We use object-fit: cover ONLY here
        because the image itself is being
        split into two physical halves.

        The image width is 200% of the half.
    */

    leftImg.style.width = "200%";
    leftImg.style.maxWidth = "none";

    leftImg.style.objectFit = "contain";

    leftImg.style.objectPosition = "left center";

    left.appendChild(leftImg);


    /*
        RIGHT HALF
    */

    const right = document.createElement("div");

    right.className = "half";

    const rightImg = document.createElement("img");

    rightImg.src = item.image;

    rightImg.draggable = false;

    rightImg.style.width = "200%";
    rightImg.style.maxWidth = "none";

    rightImg.style.objectFit = "contain";

    rightImg.style.objectPosition = "right center";

    right.appendChild(rightImg);


    spread.appendChild(left);
    spread.appendChild(right);

    book.appendChild(spread);

    return spread;
}


/*
---------------------------------------------------------
Build book
---------------------------------------------------------
*/

function buildBook() {

    book.innerHTML = "";

    pages.forEach((item, index) => {

        if (item.type === "single") {

            createSinglePage(item, index);

        }

        else if (item.type === "spread") {

            createSpread(item, index);

        }

    });

    updatePages();

}


/*
---------------------------------------------------------
Update visible page
---------------------------------------------------------
*/

function updatePages() {

    const allPages =
        document.querySelectorAll(".page, .spread");

    allPages.forEach((page, index) => {

        page.style.zIndex =
            pages.length - index;

        page.style.display =
            index <= currentPage
                ? "flex"
                : "none";

    });

    pageNumber.innerText =
        "Page " + (currentPage + 1)
        + " / " + pages.length;
}


/*
---------------------------------------------------------
NEXT
---------------------------------------------------------
*/

function nextPage() {

    if (busy) return;

    if (currentPage >= pages.length - 1) {
        return;
    }

    busy = true;

    const allPages =
        document.querySelectorAll(".page, .spread");

    const current =
        allPages[currentPage];

    current.style.display = "flex";

    current.classList.add("turning");

    setTimeout(() => {

        currentPage++;

        updatePages();

        busy = false;

    }, 900);
}


/*
---------------------------------------------------------
PREVIOUS
---------------------------------------------------------
*/

function previousPage() {

    if (busy) return;

    if (currentPage <= 0) {
        return;
    }

    busy = true;

    currentPage--;

    const allPages =
        document.querySelectorAll(".page, .spread");

    const previous =
        allPages[currentPage];

    previous.style.display = "flex";

    previous.classList.remove("turning");

    updatePages();

    setTimeout(() => {

        busy = false;

    }, 900);
}


/*
---------------------------------------------------------
Keyboard
---------------------------------------------------------
*/

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowRight") {

        nextPage();

    }

    if (e.key === "ArrowLeft") {

        previousPage();

    }

});


/*
---------------------------------------------------------
START
---------------------------------------------------------
*/

buildBook();

</script>

</body>
</html>
