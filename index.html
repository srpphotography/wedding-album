<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRP Photography - Wedding Album</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:url("background.jpg") center/cover no-repeat fixed;
    font-family:Arial,sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    z-index:0;
}

/* START SCREEN */

#start{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;

    color:white;
    background:rgba(0,0,0,.90);
}

#startLogo{
    width:140px;
    height:140px;
    object-fit:contain;
}

#startTitle{
    font-size:30px;
    font-weight:bold;
}

#startBtn{
    padding:14px 30px;
    font-size:20px;
    border:0;
    border-radius:12px;
    cursor:pointer;
}

#loading{
    display:none;
}

/* BOOK */

#app{
    position:relative;
    z-index:5;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;
}

#book{
    /*
       2520 × 840 = EXACT 3:1
    */
    width:min(94vw,1500px);
    aspect-ratio:3 / 1;
}

/* FIXED LOGO */

#cornerLogo{
    position:fixed;

    top:15px;
    left:15px;

    width:75px;
    height:75px;

    object-fit:contain;

    z-index:2000;
    display:none;

    filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));
}

/* WHATSAPP */

#whatsapp{
    position:fixed;

    right:15px;
    bottom:15px;

    z-index:2000;
    display:none;

    align-items:center;
    gap:8px;

    padding:10px 16px;

    border-radius:30px;

    background:#25D366;
    color:white;

    text-decoration:none;
    font-size:15px;
    font-weight:bold;

    box-shadow:0 4px 14px rgba(0,0,0,.5);
}

#waIcon{
    font-size:22px;
}

/* PAGE FLIP IMAGE */

.stf__item img{
    width:100% !important;
    height:100% !important;

    object-fit:contain !important;

    display:block;
}

/* MOBILE */

@media(max-width:600px){

    #startLogo{
        width:110px;
        height:110px;
    }

    #startTitle{
        font-size:24px;
    }

    #cornerLogo{
        width:55px;
        height:55px;
        left:8px;
        top:8px;
    }

    #whatsapp{
        right:8px;
        bottom:8px;
        padding:8px 12px;
        font-size:12px;
    }

    #waIcon{
        font-size:19px;
    }

    #book{
        width:96vw;
    }
}
</style>
</head>

<body>

<!-- START -->

<div id="start">

    <img
        id="startLogo"
        src="logo.png"
        alt="SRP Photography">

    <div id="startTitle">
        📖 Wedding Album
    </div>

    <button id="startBtn">
        ▶️ Tap to Start Album
    </button>

    <div id="loading">
        Album loading...
    </div>

</div>


<!-- FIXED LOGO -->

<img
    id="cornerLogo"
    src="logo.png"
    alt="SRP Photography">


<!-- ALBUM -->

<div id="app">
    <div id="book"></div>
</div>


<!-- WHATSAPP -->

<a
    id="whatsapp"
    href="https://wa.me/916262735390"
    target="_blank">

    <span id="waIcon">💬</span>
    <span>+91 62627 35390</span>

</a>


<!-- MUSIC -->

<audio id="music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>


<!-- PAGE FLIP -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>

const start =
document.getElementById("start");

const startBtn =
document.getElementById("startBtn");

const loading =
document.getElementById("loading");

const book =
document.getElementById("book");

const music =
document.getElementById("music");

const cornerLogo =
document.getElementById("cornerLogo");

const whatsapp =
document.getElementById("whatsapp");


/*
    GitHub Pages images
*/

const GITHUB_API =
"https://api.github.com/repos/srpphotography/wedding-album/contents/pages";


startBtn.addEventListener("click", async function(){

    startBtn.style.display="none";
    loading.style.display="block";

    /* MUSIC */

    try{
        await music.play();
    }
    catch(e){
        console.log("Music permission waiting");
    }


    /* FIXED CONTROLS */

    cornerLogo.style.display="block";
    whatsapp.style.display="flex";


    try{

        loading.innerText=
            "52 sheets खोज रहे हैं...";


        /* GET FILES */

        const response =
            await fetch(GITHUB_API);


        if(!response.ok){
            throw new Error(
                "Pages folder नहीं मिला"
            );
        }


        const files =
            await response.json();


        /*
            EXACT FILE PATTERN

            01 (1).jpg
            01 (2).jpg
            ...
            01 (52).jpg
        */

        const images =
            files
            .filter(file =>
                file.type==="file" &&
                /^01 \((\d+)\)\.jpg$/i
                .test(file.name)
            )
            .sort((a,b)=>{

                const A =
                    parseInt(
                        a.name.match(/\((\d+)\)/)[1]
                    );

                const B =
                    parseInt(
                        b.name.match(/\((\d+)\)/)[1]
                    );

                return A-B;

            });


        if(images.length !== 52){

            throw new Error(
                "52 sheets की जगह " +
                images.length +
                " sheets मिलीं।"
            );

        }


        /*
            Every JPG:

            2520 × 840
            EXACT 3:1

            Each JPG = complete
            LEFT + RIGHT spread.
        */

        const spreadImages =
            images.map(
                file => file.download_url
            );


        loading.innerText=
            "Flipbook तैयार हो रहा है...";


        /*
            FLIPBOOK

            1200 × 400
            EXACT 3:1
        */

        const flip =
            new St.PageFlip(
                book,
                {

                    width:1200,
                    height:400,

                    size:"stretch",

                    minWidth:600,
                    maxWidth:1500,

                    minHeight:200,
                    maxHeight:500,

                    showCover:true,

                    mobileScrollSupport:false,

                    usePortrait:false,

                    maxShadowOpacity:0.5,

                    flippingTime:700

                }
            );


        /*
            LOAD 52 COMPLETE SPREADS
        */

        flip.loadFromImages(
            spreadImages
        );


        /* HIDE START */

        start.style.display="none";


    }
    catch(error){

        loading.innerText=
            "Error: "+error.message;

        console.error(error);

    }

});

</script>

</body>
</html>
