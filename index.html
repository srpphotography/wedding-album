<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Album</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}


/* ================= START SCREEN ================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#111;
}

#startLogo{
    width:190px;
    max-width:60vw;
    max-height:190px;
    object-fit:contain;
    margin-bottom:35px;
}

#playButton{
    border:0;
    padding:16px 42px;

    border-radius:50px;

    background:white;
    color:#111;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 8px 30px rgba(0,0,0,.6);

    transition:.2s;
}

#playButton:hover{
    transform:scale(1.05);
}


/* ================= ALBUM ================= */

#albumScreen{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:#111;
}


/* ================= BOOK ================= */

#book{
    position:relative;

    width:min(94vw,1400px);

    /*
        Original page:
        2520 x 840

        Ratio:
        3 : 1
    */

    aspect-ratio:3 / 1;

    perspective:3000px;

    transform-style:preserve-3d;
}


/* ================= BACKGROUND ================= */

#albumBase{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    background:white;

    box-shadow:
        0 15px 50px rgba(0,0,0,.7);
}


/* ================= PAGE ================= */

.page{
    position:absolute;

    top:0;
    right:0;

    width:50%;
    height:100%;

    overflow:hidden;

    background:white;

    transform-origin:left center;

    transform-style:preserve-3d;

    transition:
        transform 1.1s cubic-bezier(.2,.7,.2,1);

    cursor:pointer;

    backface-visibility:hidden;
}


/*
    2520x840 image

    Visible page:
    1260x840

    Image itself:
    200% width

    Therefore exact center fold.
*/

.page img{
    position:absolute;

    top:0;
    left:0;

    width:200%;
    height:100%;

    max-width:none;

    object-fit:fill;

    display:block;

    user-select:none;

    -webkit-user-drag:none;
}


/* CENTER FOLD SHADOW */

.page::after{
    content:"";

    position:absolute;

    left:0;
    top:0;

    width:3px;
    height:100%;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.40),
            rgba(255,255,255,.20),
            rgba(0,0,0,.25)
        );

    pointer-events:none;
}


/* TURN PAGE */

.page.flipped{
    transform:rotateY(-180deg);
}


/* ================= LOGO ================= */

#albumLogo{
    position:fixed;

    top:18px;
    left:18px;

    width:100px;
    height:auto;

    max-height:100px;

    object-fit:contain;

    z-index:50000;

    pointer-events:none;
}


/* ================= WHATSAPP ================= */

#whatsapp{
    position:fixed;

    left:18px;
    bottom:15px;

    z-index:50000;

    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 15px;

    border-radius:30px;

    background:rgba(0,0,0,.78);

    color:white;

    text-decoration:none;

    font-size:15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);
}


/* ================= PAGE COUNTER ================= */

#counter{
    position:fixed;

    right:18px;
    bottom:15px;

    z-index:50000;

    color:white;

    background:rgba(0,0,0,.65);

    padding:7px 13px;

    border-radius:20px;

    font-size:14px;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    #book{
        width:96vw;
    }

    #startLogo{
        width:130px;
    }

    #playButton{
        font-size:17px;
        padding:14px 30px;
    }

    #albumLogo{
        width:65px;
        top:10px;
        left:10px;
    }

    #whatsapp{
        left:10px;
        bottom:10px;
        font-size:12px;
        padding:7px 11px;
    }
}
</style>
</head>


<body>


<!-- =================================================
     START SCREEN
================================================= -->

<div id="startScreen">

    <img
        id="startLogo"
        src="logo.png"
        alt="SRP Photography"
    >

    <button id="playButton">
        ▶ PLAY ALBUM
    </button>

</div>



<!-- =================================================
     ALBUM SCREEN
================================================= -->

<div id="albumScreen">


    <!-- LOGO -->

    <img
        id="albumLogo"
        src="logo.png"
        alt="SRP Photography"
    >


    <!-- BOOK -->

    <div id="book">

        <div id="albumBase"></div>

    </div>


    <!-- =================================================
         WHATSAPP
    ================================================= -->

    <a
        id="whatsapp"

        href="https://wa.me/916262735390?text=Hello%20SRP%20Photography%2C%20I%20want%20to%20know%20about%20your%20wedding%20album."

        target="_blank"

        rel="noopener noreferrer"
    >

        💬

        <span>
            +91 6262735390
        </span>

    </a>


    <!-- PAGE NUMBER -->

    <div id="counter">
        1 / 52
    </div>


</div>



<!-- =================================================
     BACKGROUND MUSIC

     File name:
     music.mp3
================================================= -->

<audio
    id="music"
    src="music.mp3"
    loop
    preload="auto">
</audio>



<script>

/* =================================================
   ALBUM FILES

   Automatically creates:

   01 (1).jpg
   01 (2).jpg
   ...
   01 (52).jpg

   All pages:
   2520 x 840
================================================= */

const pages = [];

for(let i = 1; i <= 52; i++){

    pages.push(
        `01 (${i}).jpg`
    );

}


/* =================================================
   ELEMENTS
================================================= */

const startScreen =
    document.getElementById("startScreen");

const albumScreen =
    document.getElementById("albumScreen");

const playButton =
    document.getElementById("playButton");

const music =
    document.getElementById("music");

const book =
    document.getElementById("book");

const counter =
    document.getElementById("counter");


/* =================================================
   CURRENT PAGE
================================================= */

let currentPage = 0;


/* =================================================
   CREATE PAGES
================================================= */

function createPages(){

    pages.forEach(
        function(imageName,index){

            const page =
                document.createElement("div");

            page.className = "page";

            page.dataset.index = index;


            const image =
                document.createElement("img");

            image.src = imageName;

            image.alt =
                "Wedding Album Page " +
                (index + 1);

            image.draggable = false;


            page.appendChild(image);

            book.appendChild(page);


            /*
                Page 1 front
                Page 52 back
            */

            page.style.zIndex =
                pages.length - index;


            /*
                CLICK RIGHT SIDE
                NEXT PAGE

                CLICK LEFT SIDE
                PREVIOUS PAGE
            */

            page.addEventListener(
                "click",
                function(event){

                    const rect =
                        book.getBoundingClientRect();

                    const x =
                        event.clientX -
                        rect.left;


                    if(
                        x >
                        rect.width / 2
                    ){

                        nextPage();

                    }
                    else{

                        previousPage();

                    }

                }
            );

        }
    );


    updateCounter();

}


/* =================================================
   PLAY ALBUM
================================================= */

playButton.addEventListener(
    "click",
    function(){

        startScreen.style.display =
            "none";

        albumScreen.style.display =
            "flex";


        /*
            Music starts because
            user clicked PLAY.
        */

        music.play().catch(
            function(error){

                console.log(
                    "Music error:",
                    error
                );

            }
        );

    }
);


/* =================================================
   NEXT PAGE
================================================= */

function nextPage(){

    if(
        currentPage >=
        pages.length
    ){

        return;

    }


    const page =
        document.querySelector(
            '.page[data-index="' +
            currentPage +
            '"]'
        );


    if(!page){

        return;

    }


    page.classList.add("flipped");

    currentPage++;

    updateCounter();

}


/* =================================================
   PREVIOUS PAGE
================================================= */

function previousPage(){

    if(
        currentPage <= 0
    ){

        return;

    }


    currentPage--;


    const page =
        document.querySelector(
            '.page[data-index="' +
            currentPage +
            '"]'
        );


    if(!page){

        return;

    }


    page.classList.remove("flipped");

    updateCounter();

}


/* =================================================
   COUNTER
================================================= */

function updateCounter(){

    let number =
        currentPage + 1;


    if(
        number > pages.length
    ){

        number =
            pages.length;

    }


    counter.innerText =
        number +
        " / " +
        pages.length;

}


/* =================================================
   KEYBOARD
================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowRight"
        ){

            nextPage();

        }


        if(
            event.key === "ArrowLeft"
        ){

            previousPage();

        }

    }
);


/* =================================================
   MOBILE SWIPE
================================================= */

let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
    "touchstart",
    function(event){

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {
        passive:true
    }
);


document.addEventListener(
    "touchend",
    function(event){

        touchEndX =
            event.changedTouches[0].screenX;


        const difference =
            touchStartX -
            touchEndX;


        if(
            Math.abs(difference) < 50
        ){

            return;

        }


        if(
            difference > 0
        ){

            nextPage();

        }
        else{

            previousPage();

        }

    },
    {
        passive:true
    }
);


/* =================================================
   START
================================================= */

createPages();

</script>

</body>
</html>
