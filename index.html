<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP Photography Wedding Album</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

/* ================= START SCREEN ================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#111;
}

#startLogo{
    width:190px;
    max-width:60vw;
    max-height:190px;
    object-fit:contain;
    margin-bottom:35px;
}

#playButton{
    border:0;
    padding:16px 42px;
    border-radius:50px;
    background:white;
    color:#111;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
}

/* ================= ALBUM ================= */

#albumScreen{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:#111;
}

/* 2520 x 840 = 3:1 */

#book{
    position:relative;
    width:min(94vw,1400px);
    aspect-ratio:3 / 1;
    perspective:3000px;
}

/* ================= CURRENT FULL SPREAD ================= */

.spread{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:white;
    box-shadow:0 15px 50px rgba(0,0,0,.7);
}

.spread img{
    width:100%;
    height:100%;
    display:block;
    object-fit:fill;
    user-select:none;
    -webkit-user-drag:none;
}

/* ================= FLIPPING RIGHT PAGE ================= */

.flipPage{
    position:absolute;
    top:0;
    right:0;

    width:50%;
    height:100%;

    overflow:hidden;

    transform-origin:left center;
    transform-style:preserve-3d;

    transition:transform 1.05s cubic-bezier(.2,.7,.2,1);

    z-index:100;

    background:white;
}

.flipPage img{
    position:absolute;

    top:0;
    left:-100%;

    width:200%;
    height:100%;

    max-width:none;

    object-fit:fill;

    display:block;

    user-select:none;
    -webkit-user-drag:none;
}

/* Center fold */

.flipPage::after{
    content:"";

    position:absolute;
    left:0;
    top:0;

    width:3px;
    height:100%;

    background:linear-gradient(
        to right,
        rgba(0,0,0,.45),
        rgba(255,255,255,.2),
        rgba(0,0,0,.25)
    );
}

.flipPage.flipped{
    transform:rotateY(-180deg);
}

/* ================= LOGO ================= */

#albumLogo{
    position:fixed;
    top:18px;
    left:18px;
    width:100px;
    max-height:100px;
    object-fit:contain;
    z-index:5000;
    pointer-events:none;
}

/* ================= WHATSAPP ================= */

#whatsapp{
    position:fixed;
    left:18px;
    bottom:15px;
    z-index:5000;

    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 15px;

    border-radius:30px;

    background:rgba(0,0,0,.78);

    color:white;
    text-decoration:none;

    font-size:15px;
}

/* ================= COUNTER ================= */

#counter{
    position:fixed;
    right:18px;
    bottom:15px;
    z-index:5000;

    color:white;
    background:rgba(0,0,0,.65);

    padding:7px 13px;
    border-radius:20px;
    font-size:14px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    #book{
        width:96vw;
    }

    #startLogo{
        width:130px;
    }

    #playButton{
        font-size:17px;
        padding:14px 30px;
    }

    #albumLogo{
        width:65px;
        top:10px;
        left:10px;
    }

    #whatsapp{
        left:10px;
        bottom:10px;
        font-size:12px;
        padding:7px 11px;
    }
}
</style>
</head>

<body>

<!-- ================= START ================= -->

<div id="startScreen">

    <img
        id="startLogo"
        src="logo.png"
        alt="SRP Photography"
    >

    <button id="playButton">
        ▶ PLAY ALBUM
    </button>

</div>


<!-- ================= ALBUM ================= -->

<div id="albumScreen">

    <img
        id="albumLogo"
        src="logo.png"
        alt="SRP Photography"
    >

    <div id="book"></div>

    <a
        id="whatsapp"
        href="https://wa.me/916262735390?text=Hello%20SRP%20Photography%2C%20I%20want%20to%20know%20about%20your%20wedding%20album."
        target="_blank"
        rel="noopener noreferrer"
    >
        💬 +91 6262735390
    </a>

    <div id="counter">1 / 52</div>

</div>


<!-- ================= MUSIC ================= -->

<audio
    id="music"
    src="music.mp3"
    loop
    preload="auto">
</audio>


<script>

/* =====================================================
   52 SPREADS
===================================================== */

const pages = [];

for(let i = 1; i <= 52; i++){

    pages.push(`01 (${i}).jpg`);

}


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const albumScreen =
    document.getElementById("albumScreen");

const playButton =
    document.getElementById("playButton");

const music =
    document.getElementById("music");

const book =
    document.getElementById("book");

const counter =
    document.getElementById("counter");


let currentPage = 0;


/* =====================================================
   SHOW SPREAD
===================================================== */

function createSpread(index){

    book.innerHTML = "";

    /* Current full 2520x840 image */

    const spread =
        document.createElement("div");

    spread.className = "spread";


    const spreadImage =
        document.createElement("img");

    spreadImage.src =
        pages[index];

    spreadImage.draggable = false;


    spread.appendChild(spreadImage);

    book.appendChild(spread);


    /*
       If there is a next page,
       create the right half that flips.
    */

    if(index < pages.length - 1){

        const flip =
            document.createElement("div");

        flip.className = "flipPage";


        const flipImage =
            document.createElement("img");

        /*
           Next page image.

           Because image width = 200%
           and left = -100%,

           the visible half is exactly
           the LEFT 1260px of next spread.
        */

        flipImage.src =
            pages[index + 1];

        flipImage.draggable = false;


        flip.appendChild(flipImage);

        book.appendChild(flip);


        /*
           Clicking right side
           turns page.
        */

        flip.addEventListener(
            "click",
            function(){

                nextPage();

            }
        );

    }


    updateCounter();

}


/* =====================================================
   NEXT
===================================================== */

function nextPage(){

    if(currentPage >= pages.length - 1){

        return;

    }


    const flip =
        document.querySelector(".flipPage");


    if(!flip){

        return;

    }


    flip.classList.add("flipped");


    setTimeout(function(){

        currentPage++;

        createSpread(currentPage);

    },1050);

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousPage(){

    if(currentPage <= 0){

        return;

    }

    currentPage--;

    createSpread(currentPage);

}


/* =====================================================
   COUNTER
===================================================== */

function updateCounter(){

    counter.innerText =
        (currentPage + 1) +
        " / " +
        pages.length;

}


/* =====================================================
   PLAY
===================================================== */

playButton.addEventListener(
    "click",
    function(){

        startScreen.style.display =
            "none";

        albumScreen.style.display =
            "flex";

        music.play().catch(
            function(error){

                console.log(
                    "Music error:",
                    error
                );

            }
        );

        createSpread(0);

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowRight"){

            nextPage();

        }

        if(event.key === "ArrowLeft"){

            previousPage();

        }

    }
);


/* =====================================================
   TOUCH SWIPE
===================================================== */

let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
    "touchstart",
    function(event){

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {passive:true}
);


document.addEventListener(
    "touchend",
    function(event){

        touchEndX =
            event.changedTouches[0].screenX;

        const difference =
            touchStartX - touchEndX;


        if(Math.abs(difference) < 50){

            return;

        }


        if(difference > 0){

            nextPage();

        }
        else{

            previousPage();

        }

    },
    {passive:true}
);

</script>

</body>
</html>
