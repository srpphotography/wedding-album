<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wedding Album</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    background:#111 url("background.jpg") center center / cover no-repeat fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.30);
    z-index:0;
}

#start{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(0,0,0,.90);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:16px;
    text-align:center;
}

#startLogo{
    width:140px;
    height:140px;
    object-fit:contain;
}

#startTitle{
    font-size:30px;
    font-weight:bold;
}

#startBtn{
    font-size:20px;
    padding:14px 30px;
    border:0;
    border-radius:12px;
    cursor:pointer;
}

#loading{
    display:none;
    font-size:16px;
}

#app{
    position:relative;
    z-index:5;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#book{
    width:min(94vw,1200px);
    height:min(88vh,600px);
}

/* FIXED LOGO */

#cornerLogo{
    position:fixed;
    left:15px;
    top:15px;

    width:75px;
    height:75px;

    object-fit:contain;

    z-index:100;
    display:none;

    filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));

    pointer-events:none;
}

/* WHATSAPP */

#whatsapp{
    position:fixed;
    right:15px;
    bottom:15px;

    z-index:100;
    display:none;

    align-items:center;
    gap:8px;

    background:#25D366;
    color:white;

    text-decoration:none;

    padding:10px 15px;
    border-radius:30px;

    font-size:15px;
    font-weight:bold;

    box-shadow:0 4px 14px rgba(0,0,0,.5);
}

#waIcon{
    font-size:22px;
}

@media(max-width:600px){

    #startLogo{
        width:110px;
        height:110px;
    }

    #startTitle{
        font-size:24px;
    }

    #cornerLogo{
        width:55px;
        height:55px;
        left:8px;
        top:8px;
    }

    #whatsapp{
        right:8px;
        bottom:8px;
        padding:8px 12px;
        font-size:12px;
    }

    #waIcon{
        font-size:19px;
    }

    #book{
        width:96vw;
        height:70vh;
    }
}
</style>
</head>

<body>

<div id="start">

    <img
        id="startLogo"
        src="logo.png"
        alt="SRP Photography">

    <div id="startTitle">
        📖 Wedding Album
    </div>

    <button id="startBtn">
        ▶️ Tap to Start Album
    </button>

    <div id="loading">
        Album loading...
    </div>

</div>

<img
    id="cornerLogo"
    src="logo.png"
    alt="SRP Photography">

<div id="app">
    <div id="book"></div>
</div>

<a
    id="whatsapp"
    href="https://wa.me/916262735390"
    target="_blank">

    <span id="waIcon">💬</span>
    <span>+91 62627 35390</span>

</a>

<audio id="music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>

const start =
document.getElementById("start");

const startBtn =
document.getElementById("startBtn");

const loading =
document.getElementById("loading");

const book =
document.getElementById("book");

const music =
document.getElementById("music");

const cornerLogo =
document.getElementById("cornerLogo");

const whatsapp =
document.getElementById("whatsapp");

const GITHUB_API =
"https://api.github.com/repos/srpphotography/wedding-album/contents/pages";


startBtn.addEventListener("click", async function(){

    startBtn.style.display="none";
    loading.style.display="block";

    try{
        await music.play();
    }catch(e){}


    cornerLogo.style.display="block";
    whatsapp.style.display="flex";


    try{

        loading.innerText=
        "Album pages खोज रहे हैं...";


        const response =
        await fetch(GITHUB_API);


        if(!response.ok){
            throw new Error("Pages folder नहीं मिला");
        }


        const files =
        await response.json();


        const images =
        files
        .filter(file =>
            file.type==="file" &&
            /\.(jpg|jpeg|png|webp)$/i.test(file.name)
        )
        .sort((a,b)=>
            a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
        );


        if(images.length===0){
            throw new Error("JPG images नहीं मिलीं");
        }


        loading.innerText =
        images.length +
        " photos मिलीं...";


        /*
          IMPORTANT:
          Images को canvas में नहीं डाल रहे।
          Direct JPG इस्तेमाल हो रही हैं।
        */

        const pageImages =
        images.map(file => file.download_url);


        /*
          Flipbook का fixed frame 2:1 है,
          लेकिन हर JPG अपने original ratio में
          contain होगी।
        */

        const flip =
        new St.PageFlip(
            book,
            {
                width:1200,
                height:600,

                size:"stretch",

                minWidth:280,
                maxWidth:1200,

                minHeight:300,
                maxHeight:700,

                showCover:true,

                mobileScrollSupport:false,

                usePortrait:false,

                maxShadowOpacity:.5,

                flippingTime:650
            }
        );


        flip.loadFromImages(pageImages);


        start.style.display="none";


    }catch(error){

        loading.innerText=
        "Error: "+error.message;

        console.error(error);

    }

});

</script>

</body>
</html>
