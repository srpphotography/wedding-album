<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Album</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#start{
    position:fixed;
    inset:0;
    z-index:10;
    background:rgba(0,0,0,.92);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
}

#start button{
    font-size:20px;
    padding:14px 28px;
    border:0;
    border-radius:10px;
    cursor:pointer;
}

#loading{
    display:none;
    color:white;
    font-size:18px;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#book{
    width:min(94vw,1200px);
    height:min(86vh,900px);
}

canvas{
    max-width:100%;
    max-height:100%;
}
</style>
</head>

<body>

<div id="start">
    <div style="font-size:28px">📖 Wedding Album</div>
    <button id="startBtn">▶️ Tap to Start Album</button>
    <div id="loading">Album loading...</div>
</div>

<div id="app">
    <div id="book"></div>
</div>

<audio id="music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const start = document.getElementById("start");
const btn = document.getElementById("startBtn");
const loading = document.getElementById("loading");
const music = document.getElementById("music");
const book = document.getElementById("book");

async function renderPDF(){

    loading.style.display = "block";
    btn.style.display = "none";

    try {

        const pdf = await pdfjsLib.getDocument("album.pdf").promise;

        const pages = [];

        let pageWidth = 600;
        let pageHeight = 900;

        for(let i = 1; i <= pdf.numPages; i++){

            loading.innerText =
                "Album loading... " + i + " / " + pdf.numPages;

            const page = await pdf.getPage(i);

            const originalViewport = page.getViewport({
                scale: 1
            });

            const ratio =
                originalViewport.height /
                originalViewport.width;

            if(i === 1){
                pageWidth = 600;
                pageHeight = Math.round(pageWidth * ratio);
            }

            const viewport = page.getViewport({
                scale: 1.2
            });

            const canvas = document.createElement("canvas");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            const context = canvas.getContext("2d");

            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;

            pages.push(canvas.toDataURL("image/jpeg",0.82));
        }

        loading.innerText = "Album तैयार हो रहा है...";

        const flip = new St.PageFlip(book,{
            width:pageWidth,
            height:pageHeight,

            size:"stretch",

            minWidth:280,
            maxWidth:1000,

            minHeight:420,
            maxHeight:1400,

            showCover:true,
            mobileScrollSupport:false,

            usePortrait:true,

            maxShadowOpacity:0.5,
            flippingTime:700
        });

        flip.loadFromImages(pages);

        loading.style.display = "none";
        start.style.display = "none";

    } catch(error){

        loading.innerText =
            "Album load नहीं हो पाया: " + error.message;

        console.error(error);
    }
}

btn.addEventListener("click", async function(){

    try{
        await music.play();
    }catch(e){}

    await renderPDF();

});

</script>

</body>
</html>
