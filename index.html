<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRP Photography Wedding Album</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}


/* ================= START ================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#111;
}

#startLogo{
    width:190px;
    max-width:60vw;
    max-height:190px;
    object-fit:contain;
    margin-bottom:35px;
}

#playButton{
    border:0;
    padding:16px 42px;
    border-radius:50px;

    background:white;
    color:#111;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 8px 30px rgba(0,0,0,.6);
}


/* ================= ALBUM ================= */

#albumScreen{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:#111;
}


/* ================= BOOK ================= */

#book{
    position:relative;

    width:min(94vw,1400px);
    aspect-ratio:3 / 1;

    perspective:3000px;

    transform-style:preserve-3d;

    box-shadow:0 15px 50px rgba(0,0,0,.7);

    overflow:visible;
}


/* ================= CURRENT FULL PAGE ================= */

#currentSpread{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:white;

    z-index:10;
}

#currentSpread img{
    width:100%;
    height:100%;

    display:block;

    object-fit:fill;

    user-select:none;
    -webkit-user-drag:none;
}


/* ================= FLIP SHEET ================= */

#flipSheet{

    position:absolute;

    top:0;
    right:0;

    width:50%;
    height:100%;

    z-index:20;

    transform-origin:left center;

    transform-style:preserve-3d;

    transition:
        transform 1.15s cubic-bezier(.22,.61,.36,1);

    pointer-events:none;
}


/* FRONT AND BACK */

.flipFace{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:white;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}


/* ================= FRONT ================= */

/*
   Current page RIGHT HALF
*/

#frontImage{

    position:absolute;

    top:0;
    right:0;

    width:200%;
    height:100%;

    max-width:none;

    object-fit:fill;

    display:block;

    user-select:none;
    -webkit-user-drag:none;
}


/* ================= BACK ================= */

/*
   Next page LEFT HALF
*/

#backFace{

    transform:rotateY(180deg);
}

#backImage{

    position:absolute;

    top:0;
    left:0;

    width:200%;
    height:100%;

    max-width:none;

    object-fit:fill;

    display:block;

    user-select:none;
    -webkit-user-drag:none;
}


/* ================= FOLD ================= */

#flipSheet::after{

    content:"";

    position:absolute;

    left:-2px;
    top:0;

    width:5px;
    height:100%;

    z-index:100;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.45),
            rgba(255,255,255,.2),
            rgba(0,0,0,.3)
        );
}


/* ================= FLIP ================= */

#flipSheet.flipped{

    transform:rotateY(-180deg);
}


/* ================= LOGO ================= */

#albumLogo{

    position:fixed;

    top:18px;
    left:18px;

    width:100px;
    max-height:100px;

    object-fit:contain;

    z-index:5000;

    pointer-events:none;
}


/* ================= WHATSAPP ================= */

#whatsapp{

    position:fixed;

    left:18px;
    bottom:15px;

    z-index:5000;

    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 15px;

    border-radius:30px;

    background:rgba(0,0,0,.78);

    color:white;

    text-decoration:none;

    font-size:15px;
}


/* ================= COUNTER ================= */

#counter{

    position:fixed;

    right:18px;
    bottom:15px;

    z-index:5000;

    color:white;

    background:rgba(0,0,0,.65);

    padding:7px 13px;

    border-radius:20px;

    font-size:14px;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    #book{
        width:96vw;
    }

    #startLogo{
        width:130px;
    }

    #playButton{
        font-size:17px;
        padding:14px 30px;
    }

    #albumLogo{
        width:65px;
        top:10px;
        left:10px;
    }

    #whatsapp{
        left:10px;
        bottom:10px;
        font-size:12px;
        padding:7px 11px;
    }
}
</style>
</head>


<body>


<!-- ================= START SCREEN ================= -->

<div id="startScreen">

    <img
        id="startLogo"
        src="logo.png"
        alt="SRP Photography"
    >

    <button id="playButton">
        ▶ PLAY ALBUM
    </button>

</div>


<!-- ================= ALBUM ================= -->

<div id="albumScreen">

    <img
        id="albumLogo"
        src="logo.png"
        alt="SRP Photography"
    >


    <div id="book">

        <!-- CURRENT COMPLETE 2520x840 SPREAD -->

        <div id="currentSpread">
            <img id="currentImage" src="">
        </div>


        <!-- ONLY THE RIGHT 1260px FLIPS -->

        <div id="flipSheet">

            <!-- FRONT -->

            <div
                class="flipFace"
                id="frontFace"
            >

                <img
                    id="frontImage"
                    src=""
                >

            </div>


            <!-- BACK -->

            <div
                class="flipFace"
                id="backFace"
            >

                <img
                    id="backImage"
                    src=""
                >

            </div>

        </div>

    </div>


    <!-- WHATSAPP -->

    <a
        id="whatsapp"
        href="https://wa.me/916262735390?text=Hello%20SRP%20Photography%2C%20I%20want%20to%20know%20about%20your%20wedding%20album."
        target="_blank"
        rel="noopener noreferrer"
    >
        💬 +91 6262735390
    </a>


    <div id="counter">
        1 / 52
    </div>

</div>


<!-- ================= MUSIC ================= -->

<audio
    id="music"
    src="music.mp3"
    loop
    preload="auto">
</audio>


<script>

/* =====================================================
   YOUR 52 PAGES
===================================================== */

const pages = [];

for(let i = 1; i <= 52; i++){

    pages.push(
        `01 (${i}).jpg`
    );

}


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const albumScreen =
    document.getElementById("albumScreen");

const playButton =
    document.getElementById("playButton");

const music =
    document.getElementById("music");

const currentImage =
    document.getElementById("currentImage");

const frontImage =
    document.getElementById("frontImage");

const backImage =
    document.getElementById("backImage");

const flipSheet =
    document.getElementById("flipSheet");

const counter =
    document.getElementById("counter");


/* =====================================================
   STATE
===================================================== */

let currentPage = 0;

let animating = false;


/* =====================================================
   LOAD CURRENT PAGE
===================================================== */

function showPage(index){

    currentPage = index;

    /*
       Complete current spread
    */

    currentImage.src =
        pages[index];


    /*
       Front of turning sheet
       = current page
       RIGHT HALF
    */

    frontImage.src =
        pages[index];


    /*
       Back of turning sheet
       = NEXT page
       LEFT HALF
    */

    if(index < pages.length - 1){

        backImage.src =
            pages[index + 1];

    }
    else{

        backImage.src =
            pages[index];

    }


    /*
       Make absolutely sure
       sheet is not flipped.
    */

    flipSheet.classList.remove(
        "flipped"
    );


    updateCounter();

}


/* =====================================================
   NEXT PAGE
===================================================== */

function nextPage(){

    if(animating){

        return;

    }


    if(
        currentPage >=
        pages.length - 1
    ){

        return;

    }


    animating = true;


    /*
       Put the NEXT page behind the
       flipping sheet.

       The current complete spread
       remains underneath.
    */

    backImage.src =
        pages[currentPage + 1];


    /*
       Start physical flip.
    */

    flipSheet.classList.add(
        "flipped"
    );


    /*
       WAIT FOR ANIMATION TO FINISH.

       Do NOT change the page before
       the animation ends.
    */

    setTimeout(
        function(){

            currentPage++;


            /*
               Now make the new page
               the complete visible spread.
            */

            currentImage.src =
                pages[currentPage];


            /*
               Prepare the next flip.
            */

            frontImage.src =
                pages[currentPage];


            if(
                currentPage <
                pages.length - 1
            ){

                backImage.src =
                    pages[currentPage + 1];

            }
            else{

                backImage.src =
                    pages[currentPage];

            }


            /*
               Turn the sheet back
               WITHOUT transition.

               This prevents duplicate page
               and visual jump.
            */

            flipSheet.style.transition =
                "none";

            flipSheet.classList.remove(
                "flipped"
            );


            /*
               Force browser to apply reset.
            */

            void flipSheet.offsetWidth;


            /*
               Restore animation.
            */

            flipSheet.style.transition =
                "transform 1.15s cubic-bezier(.22,.61,.36,1)";


            updateCounter();


            animating = false;

        },
        1150
    );

}


/* =====================================================
   PREVIOUS PAGE
===================================================== */

function previousPage(){

    if(animating){

        return;

    }


    if(currentPage <= 0){

        return;

    }


    /*
       Previous direction is handled
       as a complete spread change.

       No duplicate page.
    */

    currentPage--;


    currentImage.src =
        pages[currentPage];


    frontImage.src =
        pages[currentPage];


    if(
        currentPage <
        pages.length - 1
    ){

        backImage.src =
            pages[currentPage + 1];

    }
    else{

        backImage.src =
            pages[currentPage];

    }


    flipSheet.style.transition =
        "none";

    flipSheet.classList.remove(
        "flipped"
    );

    void flipSheet.offsetWidth;

    flipSheet.style.transition =
        "transform 1.15s cubic-bezier(.22,.61,.36,1)";


    updateCounter();

}


/* =====================================================
   COUNTER
===================================================== */

function updateCounter(){

    counter.innerText =
        (currentPage + 1)
        + " / "
        + pages.length;

}


/* =====================================================
   PLAY
===================================================== */

playButton.addEventListener(
    "click",
    function(){

        startScreen.style.display =
            "none";

        albumScreen.style.display =
            "flex";


        showPage(0);


        /*
           Start music after user click.
        */

        music.play().catch(
            function(error){

                console.log(
                    "Music:",
                    error
                );

            }
        );

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "ArrowRight"
        ){

            event.preventDefault();

            nextPage();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            event.preventDefault();

            previousPage();

        }

    }
);


/* =====================================================
   CLICK RIGHT / LEFT
===================================================== */

document
.getElementById("book")
.addEventListener(
    "click",
    function(event){

        /*
           Only react to normal book clicks.
        */

        const rect =
            this.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        /*
           RIGHT HALF
           = NEXT
        */

        if(
            x >
            rect.width / 2
        ){

            nextPage();

        }


        /*
           LEFT HALF
           = PREVIOUS
        */

        else{

            previousPage();

        }

    }
);


/* =====================================================
   SWIPE
===================================================== */

let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
    "touchstart",
    function(event){

        touchStartX =
            event.changedTouches[0]
            .screenX;

    },
    {
        passive:true
    }
);


document.addEventListener(
    "touchend",
    function(event){

        touchEndX =
            event.changedTouches[0]
            .screenX;


        const distance =
            touchStartX -
            touchEndX;


        if(
            Math.abs(distance) < 50
        ){

            return;

        }


        if(distance > 0){

            nextPage();

        }
        else{

            previousPage();

        }

    },
    {
        passive:true
    }
);

</script>

</body>
</html>
