<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRP Photography Wedding Album</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}


/* ================= START SCREEN ================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#111;
}

#startLogo{
    width:190px;
    max-width:60vw;
    max-height:190px;
    object-fit:contain;

    margin-bottom:35px;
}

#playButton{
    border:0;
    outline:0;

    padding:16px 42px;

    border-radius:50px;

    background:white;
    color:#111;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 8px 30px rgba(0,0,0,.6);
}

#playButton:hover{
    transform:scale(1.04);
}


/* ================= ALBUM ================= */

#albumScreen{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:#111;
}


/* ================= BOOK ================= */

#book{
    position:relative;

    width:min(94vw,1400px);

    aspect-ratio:3 / 1;

    perspective:3000px;

    transform-style:preserve-3d;

    box-shadow:
        0 15px 50px rgba(0,0,0,.7);
}


/* ================= CURRENT SPREAD ================= */

#currentSpread{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:white;

    z-index:10;
}

#currentImage{
    width:100%;
    height:100%;

    display:block;

    object-fit:fill;

    user-select:none;
    -webkit-user-drag:none;
}


/* ================= NEXT PAGE BEHIND ================= */

/*
   Next complete spread is placed behind
   the current page.
*/

#nextSpread{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:white;

    z-index:5;
}

#nextImage{
    width:100%;
    height:100%;

    display:block;

    object-fit:fill;

    user-select:none;
    -webkit-user-drag:none;
}


/* ================= FLIP SHEET ================= */

#flipSheet{
    position:absolute;

    top:0;
    right:0;

    width:50%;
    height:100%;

    z-index:20;

    transform-origin:left center;

    transform-style:preserve-3d;

    transition:
        transform 1.15s cubic-bezier(.22,.61,.36,1);

    pointer-events:none;
}


/* ================= FRONT ================= */

#flipFront{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:white;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}


#frontImage{
    position:absolute;

    top:0;
    right:0;

    width:200%;
    height:100%;

    max-width:none;

    object-fit:fill;

    display:block;

    user-select:none;
    -webkit-user-drag:none;
}


/* ================= BACK ================= */

#flipBack{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:white;

    transform:rotateY(180deg);

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}


#backImage{
    position:absolute;

    top:0;
    left:0;

    width:200%;
    height:100%;

    max-width:none;

    object-fit:fill;

    display:block;

    user-select:none;
    -webkit-user-drag:none;
}


/* ================= FOLD SHADOW ================= */

#flipSheet::after{
    content:"";

    position:absolute;

    top:0;
    left:-2px;

    width:5px;
    height:100%;

    z-index:100;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.45),
            rgba(255,255,255,.20),
            rgba(0,0,0,.30)
        );

    pointer-events:none;
}


/* ================= FLIPPED ================= */

#flipSheet.flipped{
    transform:rotateY(-180deg);
}


/* ================= WHATSAPP ================= */

#whatsapp{
    position:fixed;

    left:18px;
    bottom:15px;

    z-index:5000;

    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 15px;

    border-radius:30px;

    background:rgba(0,0,0,.78);

    color:white;

    text-decoration:none;

    font-size:15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);
}


/* ================= COUNTER ================= */

#counter{
    position:fixed;

    right:18px;
    bottom:15px;

    z-index:5000;

    color:white;

    background:rgba(0,0,0,.65);

    padding:7px 13px;

    border-radius:20px;

    font-size:14px;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    #book{
        width:96vw;
    }

    #startLogo{
        width:130px;
    }

    #playButton{
        font-size:17px;
        padding:14px 30px;
    }

    #whatsapp{
        left:10px;
        bottom:10px;

        font-size:12px;

        padding:7px 11px;
    }

}

</style>
</head>


<body>


<!-- =================================================
     START SCREEN
================================================= -->

<div id="startScreen">

    <img
        id="startLogo"
        src="logo.png"
        alt="SRP Photography"
    >

    <button id="playButton">
        ▶ PLAY ALBUM
    </button>

</div>



<!-- =================================================
     ALBUM
================================================= -->

<div id="albumScreen">


    <div id="book">


        <!-- CURRENT PAGE -->

        <div id="currentSpread">

            <img
                id="currentImage"
                src=""
                alt=""
            >

        </div>


        <!-- NEXT PAGE BEHIND -->

        <div id="nextSpread">

            <img
                id="nextImage"
                src=""
                alt=""
            >

        </div>


        <!-- FLIPPING RIGHT HALF -->

        <div id="flipSheet">


            <!-- FRONT OF SHEET -->

            <div id="flipFront">

                <img
                    id="frontImage"
                    src=""
                    alt=""
                >

            </div>


            <!-- BACK OF SHEET -->

            <div id="flipBack">

                <img
                    id="backImage"
                    src=""
                    alt=""
                >

            </div>


        </div>


    </div>


    <!-- WHATSAPP -->

    <a
        id="whatsapp"

        href="https://wa.me/916262735390?text=Hello%20SRP%20Photography%2C%20I%20want%20to%20know%20about%20your%20wedding%20album."

        target="_blank"

        rel="noopener noreferrer"
    >

        💬 +91 6262735390

    </a>


    <!-- COUNTER -->

    <div id="counter">
        1 / 52
    </div>


</div>



<!-- =================================================
     MUSIC
================================================= -->

<audio
    id="music"
    src="music.mp3"
    loop
    preload="auto">
</audio>



<script>


/* =================================================
   52 FILES
================================================= */

const pages = [];

for(let i = 1; i <= 52; i++){

    pages.push(
        `01 (${i}).jpg`
    );

}


/* =================================================
   ELEMENTS
================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const albumScreen =
    document.getElementById(
        "albumScreen"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const music =
    document.getElementById(
        "music"
    );

const currentImage =
    document.getElementById(
        "currentImage"
    );

const nextImage =
    document.getElementById(
        "nextImage"
    );

const frontImage =
    document.getElementById(
        "frontImage"
    );

const backImage =
    document.getElementById(
        "backImage"
    );

const flipSheet =
    document.getElementById(
        "flipSheet"
    );

const book =
    document.getElementById(
        "book"
    );

const counter =
    document.getElementById(
        "counter"
    );


/* =================================================
   STATE
================================================= */

let currentPage = 0;

let isAnimating = false;


/* =================================================
   PREPARE PAGE
================================================= */

function preparePage(index){

    /*
       Current complete spread
    */

    currentImage.src =
        pages[index];


    /*
       Current page right half
    */

    frontImage.src =
        pages[index];


    /*
       Next complete spread behind
    */

    if(
        index <
        pages.length - 1
    ){

        nextImage.src =
            pages[index + 1];

        backImage.src =
            pages[index + 1];

    }
    else{

        nextImage.src =
            pages[index];

        backImage.src =
            pages[index];

    }


    updateCounter();

}


/* =================================================
   START
================================================= */

playButton.addEventListener(
    "click",
    function(){

        startScreen.style.display =
            "none";

        albumScreen.style.display =
            "flex";

        currentPage = 0;

        flipSheet.classList.remove(
            "flipped"
        );

        preparePage(0);


        music.play().catch(
            function(error){

                console.log(
                    "Music error:",
                    error
                );

            }
        );

    }
);


/* =================================================
   NEXT PAGE
================================================= */

function nextPage(){

    if(isAnimating){
        return;
    }


    if(
        currentPage >=
        pages.length - 1
    ){
        return;
    }


    isAnimating = true;


    /*
       The next complete page is ALREADY
       behind the current page.

       So as the right half flips,
       the next page appears immediately.
    */

    flipSheet.classList.add(
        "flipped"
    );


    /*
       Animation finished.
    */

    flipSheet.addEventListener(
        "transitionend",
        finishNextPage,
        {
            once:true
        }
    );

}


/* =================================================
   FINISH NEXT
================================================= */

function finishNextPage(){

    currentPage++;


    /*
       New page becomes the current
       complete spread.
    */

    currentImage.src =
        pages[currentPage];


    /*
       Prepare flipping sheet for next turn.
    */

    frontImage.src =
        pages[currentPage];


    if(
        currentPage <
        pages.length - 1
    ){

        nextImage.src =
            pages[currentPage + 1];

        backImage.src =
            pages[currentPage + 1];

    }
    else{

        nextImage.src =
            pages[currentPage];

        backImage.src =
            pages[currentPage];

    }


    /*
       Reset flip WITHOUT animation.
    */

    flipSheet.style.transition =
        "none";

    flipSheet.classList.remove(
        "flipped"
    );

    void flipSheet.offsetWidth;


    /*
       Restore animation.
    */

    flipSheet.style.transition =
        "transform 1.15s cubic-bezier(.22,.61,.36,1)";


    updateCounter();


    isAnimating = false;

}


/* =================================================
   PREVIOUS
================================================= */

function previousPage(){

    if(isAnimating){
        return;
    }


    if(currentPage <= 0){
        return;
    }


    currentPage--;


    preparePage(
        currentPage
    );

}


/* =================================================
   COUNTER
================================================= */

function updateCounter(){

    counter.innerText =
        (currentPage + 1)
        + " / "
        + pages.length;

}


/* =================================================
   RIGHT / LEFT CLICK
================================================= */

book.addEventListener(
    "click",
    function(event){

        if(isAnimating){
            return;
        }


        const rect =
            book.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        if(
            x >
            rect.width / 2
        ){

            nextPage();

        }
        else{

            previousPage();

        }

    }
);


/* =================================================
   KEYBOARD
================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "ArrowRight"
        ){

            event.preventDefault();

            nextPage();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            event.preventDefault();

            previousPage();

        }

    }
);


/* =================================================
   SWIPE
================================================= */

let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
    "touchstart",
    function(event){

        touchStartX =
            event.changedTouches[0]
            .screenX;

    },
    {
        passive:true
    }
);


document.addEventListener(
    "touchend",
    function(event){

        touchEndX =
            event.changedTouches[0]
            .screenX;


        const distance =
            touchStartX -
            touchEndX;


        if(
            Math.abs(distance) < 50
        ){
            return;
        }


        if(distance > 0){

            nextPage();

        }
        else{

            previousPage();

        }

    },
    {
        passive:true
    }
);


/* =================================================
   INITIAL
================================================= */

updateCounter();

</script>

</body>
</html>
