<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Album</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#book{width:min(94vw,1100px);height:min(86vh,760px)}
#start{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.88);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#start button{font-size:20px;padding:14px 28px;border:0;border-radius:10px;cursor:pointer}
#hint{font-size:13px;opacity:.75}
canvas{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div id="start">
  <div style="font-size:28px">📖 Wedding Album</div>
  <button id="startBtn">▶️ Tap to Start Album</button>
  <div id="hint">Music + Flipbook</div>
</div>
<div id="app"><div id="book"></div></div>

<audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
import {PageFlip} from "https://cdn.jsdelivr.net/npm/page-flip@2.0.7/+esm";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const start = document.getElementById("start");
const btn = document.getElementById("startBtn");
const music = document.getElementById("music");
const book = document.getElementById("book");

async function renderPDF() {
  const pdf = await pdfjsLib.getDocument("album.pdf").promise;
  const pages = [];
  for (let i=1; i<=pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.5});
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
    pages.push(canvas.toDataURL("image/jpeg", .88));
  }

  const flip = new PageFlip(book, {
    width: 600,
    height: 800,
    size: "stretch",
    minWidth: 280,
    maxWidth: 900,
    minHeight: 380,
    maxHeight: 1200,
    showCover: true,
    mobileScrollSupport: false,
    usePortrait: true,
    maxShadowOpacity: .5,
    flippingTime: 700
  });
  flip.loadFromImages(pages);
}

btn.addEventListener("click", async () => {
  start.style.display = "none";
  try { await music.play(); } catch(e) {}
  await renderPDF();
});
</script>
</body>
</html>
