<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wedding Album</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#start{
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(0,0,0,.94);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
    text-align:center;
}

#logo{
    width:110px;
    height:110px;
    object-fit:contain;
    border-radius:50%;
}

#start button{
    font-size:19px;
    padding:14px 28px;
    border:0;
    border-radius:10px;
    cursor:pointer;
}

#loading{
    display:none;
    font-size:16px;
    opacity:.9;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#book{
    width:min(94vw,1200px);
    height:min(86vh,900px);
}

#contact{
    position:fixed;
    right:15px;
    bottom:15px;
    z-index:15;
    background:#25D366;
    color:white;
    padding:10px 15px;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 3px 12px rgba(0,0,0,.4);
}

canvas{
    max-width:100%;
    max-height:100%;
}
</style>
</head>

<body>

<div id="start">

    <img id="logo" src="logo.png" alt="Logo">

    <div style="font-size:28px;font-weight:bold;">
        📖 Wedding Album
    </div>

    <button id="startBtn">
        ▶️ Tap to Start Album
    </button>

    <div id="loading">
        Album loading...
    </div>

</div>

<div id="app">
    <div id="book"></div>
</div>

<a id="contact"
   href="https://wa.me/916262735390"
   target="_blank">
   💬 WhatsApp
</a>

<audio id="music" preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const start = document.getElementById("start");
const btn = document.getElementById("startBtn");
const loading = document.getElementById("loading");
const music = document.getElementById("music");
const book = document.getElementById("book");

music.loop = true;

music.addEventListener("ended", function(){
    music.currentTime = 0;
    music.play().catch(()=>{});
});

async function renderPDF(){

    loading.style.display = "block";
    btn.style.display = "none";

    try{

        const pdf = await pdfjsLib
            .getDocument("album.pdf")
            .promise;

        const pages = [];

        let pageWidth = 600;
        let pageHeight = 900;

        for(let i=1;i<=pdf.numPages;i++){

            loading.innerText =
                "Album loading... " +
                i + " / " + pdf.numPages;

            const page = await pdf.getPage(i);

            const original =
                page.getViewport({scale:1});

            const ratio =
                original.height / original.width;

            if(i === 1){
                pageWidth = 600;
                pageHeight =
                    Math.round(pageWidth * ratio);
            }

            const viewport =
                page.getViewport({scale:1.1});

            const canvas =
                document.createElement("canvas");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({
                canvasContext:
                    canvas.getContext("2d"),
                viewport:viewport
            }).promise;

            pages.push(
                canvas.toDataURL(
                    "image/jpeg",
                    0.78
                )
            );
        }

        loading.innerText =
            "Album तैयार हो रहा है...";

        const flip =
            new St.PageFlip(book,{
                width:pageWidth,
                height:pageHeight,

                size:"stretch",

                minWidth:280,
                maxWidth:1000,

                minHeight:420,
                maxHeight:1400,

                showCover:true,

                mobileScrollSupport:false,

                usePortrait:true,

                maxShadowOpacity:.5,

                flippingTime:650
            });

        flip.loadFromImages(pages);

        start.style.display="none";

    }catch(error){

        loading.innerText =
            "Album load error: " +
            error.message;

        console.error(error);
    }
}

btn.addEventListener("click",async()=>{

    try{
        await music.play();
    }catch(e){}

    await renderPDF();

});

</script>

</body>
</html>
