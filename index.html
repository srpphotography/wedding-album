<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wedding Album</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* ALBUM BACKGROUND */

body{
    background:#111 url("background.jpg") center center / cover no-repeat fixed;
}

/* DARK OVERLAY */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:0;
}

/* START SCREEN */

#start{
    position:fixed;
    inset:0;
    z-index:50;

    background:rgba(0,0,0,.90);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    gap:16px;

    text-align:center;
}

#startLogo{
    width:140px;
    height:140px;

    object-fit:contain;

    border-radius:50%;
}

#startTitle{
    font-size:30px;
    font-weight:bold;
}

#startBtn{
    font-size:20px;

    padding:14px 30px;

    border:0;
    border-radius:12px;

    cursor:pointer;
}

#loading{
    display:none;
    font-size:16px;
    opacity:.9;
}

/* ALBUM AREA */

#app{
    position:relative;
    z-index:5;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;
}

#book{
    width:min(90vw,1200px);
    height:min(88vh,900px);
}

/* FIXED LOGO */

#cornerLogo{
    position:fixed;

    left:15px;
    top:15px;

    width:75px;
    height:75px;

    object-fit:contain;

    z-index:100;

    display:none;

    filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));

    pointer-events:none;
}

/* WHATSAPP */

#whatsapp{
    position:fixed;

    right:15px;
    bottom:15px;

    z-index:100;

    display:none;

    align-items:center;
    gap:8px;

    background:#25D366;

    color:white;

    text-decoration:none;

    padding:10px 15px;

    border-radius:30px;

    font-size:15px;
    font-weight:bold;

    box-shadow:0 4px 14px rgba(0,0,0,.5);

    transition:.2s;
}

#whatsapp:hover{
    transform:scale(1.05);
}

#waIcon{
    font-size:22px;
}

/* MOBILE */

@media(max-width:600px){

    #startLogo{
        width:110px;
        height:110px;
    }

    #startTitle{
        font-size:24px;
    }

    #cornerLogo{
        width:55px;
        height:55px;

        left:8px;
        top:8px;
    }

    #whatsapp{
        right:8px;
        bottom:8px;

        padding:8px 12px;

        font-size:12px;
    }

    #waIcon{
        font-size:19px;
    }

    #book{
        width:96vw;
        height:86vh;
    }
}

</style>
</head>

<body>

<!-- START SCREEN -->

<div id="start">

    <img
        id="startLogo"
        src="logo.png"
        alt="SRP Photography">

    <div id="startTitle">
        📖 Wedding Album
    </div>

    <button id="startBtn">
        ▶️ Tap to Start Album
    </button>

    <div id="loading">
        Album loading...
    </div>

</div>


<!-- FIXED LOGO -->

<img
    id="cornerLogo"
    src="logo.png"
    alt="SRP Photography">


<!-- ALBUM -->

<div id="app">

    <div id="book"></div>

</div>


<!-- WHATSAPP -->

<a
    id="whatsapp"
    href="https://wa.me/916262735390"
    target="_blank">

    <span id="waIcon">💬</span>

    <span>
        +91 62627 35390
    </span>

</a>


<!-- MUSIC -->

<audio id="music" loop preload="auto">

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<!-- PAGE FLIP -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>

const start =
    document.getElementById("start");

const startBtn =
    document.getElementById("startBtn");

const loading =
    document.getElementById("loading");

const book =
    document.getElementById("book");

const music =
    document.getElementById("music");

const cornerLogo =
    document.getElementById("cornerLogo");

const whatsapp =
    document.getElementById("whatsapp");


/*
    GitHub Pages folder
*/

const GITHUB_API =
"https://api.github.com/repos/srpphotography/wedding-album/contents/pages";


/*
    START
*/

startBtn.addEventListener(
    "click",
    async function(){

        startBtn.style.display="none";

        loading.style.display="block";

        loading.innerText=
            "Album starting...";


        /*
            MUSIC LOOP
        */

        music.loop=true;

        try{

            await music.play();

        }catch(e){

            console.log(
                "Music waiting for permission"
            );

        }


        /*
            SHOW FIXED CONTROLS
        */

        cornerLogo.style.display="block";

        whatsapp.style.display="flex";


        try{

            /*
                GET ALL JPG FILES
            */

            loading.innerText=
                "Album pages खोज रहे हैं...";


            const response =
                await fetch(GITHUB_API);


            if(!response.ok){

                throw new Error(
                    "Pages folder नहीं मिला"
                );

            }


            const files =
                await response.json();


            /*
                ONLY IMAGE FILES
            */

            const images =
                files
                .filter(file =>

                    file.type==="file" &&

                    /\.(jpg|jpeg|png|webp)$/i
                    .test(file.name)

                )
                .sort((a,b)=>

                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric:true,
                            sensitivity:"base"
                        }
                    )

                );


            if(images.length===0){

                throw new Error(
                    "JPG images नहीं मिलीं"
                );

            }


            loading.innerText=
                images.length +
                " photos मिलीं...";


            /*
                DIRECT IMAGE URLS
            */

            const pageImages =
                images.map(
                    file => file.download_url
                );


            /*
                CREATE FLIPBOOK
            */

            const flip =
                new St.PageFlip(
                    book,
                    {

                        width:600,

                        height:900,

                        size:"stretch",

                        minWidth:280,

                        maxWidth:1000,

                        minHeight:420,

                        maxHeight:1400,

                        showCover:true,

                        mobileScrollSupport:false,

                        usePortrait:true,

                        maxShadowOpacity:.5,

                        flippingTime:650

                    }
                );


            /*
                LOAD IMAGES
            */

            flip.loadFromImages(
                pageImages
            );


            /*
                HIDE START SCREEN
            */

            start.style.display="none";


        }catch(error){

            loading.innerText=
                "Error: "+
                error.message;

            console.error(error);

        }

    }
);

</script>

</body>
</html>
