<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wedding Album</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#start{
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(0,0,0,.94);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:16px;
    text-align:center;
}

#logo{
    width:120px;
    height:120px;
    object-fit:contain;
}

#start button{
    font-size:20px;
    padding:14px 30px;
    border:0;
    border-radius:10px;
    cursor:pointer;
}

#loading{
    display:none;
    font-size:16px;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#book{
    width:min(94vw,1200px);
    height:min(90vh,900px);
}

#whatsapp{
    position:fixed;
    right:15px;
    bottom:15px;
    z-index:30;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:11px 17px;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 3px 12px rgba(0,0,0,.4);
}
</style>
</head>

<body>

<div id="start">

    <img id="logo" src="logo.png" alt="Logo">

    <div style="font-size:28px;font-weight:bold;">
        📖 Wedding Album
    </div>

    <button id="startBtn">
        ▶️ Tap to Start Album
    </button>

    <div id="loading">
        Album loading...
    </div>

</div>

<div id="app">
    <div id="book"></div>
</div>

<a id="whatsapp"
   href="https://wa.me/916262735390"
   target="_blank">
   💬 WhatsApp
</a>

<audio id="music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>

const start = document.getElementById("start");
const startBtn = document.getElementById("startBtn");
const loading = document.getElementById("loading");
const book = document.getElementById("book");
const music = document.getElementById("music");

const GITHUB_API =
"https://api.github.com/repos/srpphotography/wedding-album/contents/pages";


startBtn.addEventListener("click", async function(){

    startBtn.style.display = "none";
    loading.style.display = "block";

    loading.innerText = "Album starting...";

    /* Music */
    try{
        await music.play();
    }catch(e){}

    try{

        /* GitHub se saari JPG files automatically lena */

        const response = await fetch(GITHUB_API);

        if(!response.ok){
            throw new Error("Pages folder नहीं मिला");
        }

        const files = await response.json();

        const images = files
            .filter(file =>
                file.type === "file" &&
                /\.(jpg|jpeg|png|webp)$/i.test(file.name)
            )
            .sort((a,b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )
            );

        if(images.length === 0){
            throw new Error("JPG images नहीं मिलीं");
        }

        loading.innerText =
            "Album तैयार हो रहा है... " +
            images.length + " photos";

        /*
          हर image को पहले canvas में डालेंगे।
          इससे original ratio preserve रहेगा।
        */

        const pages = [];

        for(let i=0;i<images.length;i++){

            loading.innerText =
                "Album loading... " +
                (i+1) + " / " +
                images.length;

            const img = new Image();

            img.src = images[i].download_url;

            await new Promise((resolve,reject)=>{

                img.onload = resolve;
                img.onerror = reject;

            });

            /*
              2:3 album page के अंदर image को
              बिना stretch किए fit करना।
            */

            const canvas =
                document.createElement("canvas");

            const W = 600;
            const H = 900;

            canvas.width = W;
            canvas.height = H;

            const ctx = canvas.getContext("2d");

            ctx.fillStyle = "#111";
            ctx.fillRect(0,0,W,H);

            const imageRatio =
                img.width / img.height;

            const boxRatio = W / H;

            let drawW;
            let drawH;

            if(imageRatio > boxRatio){

                drawW = W;
                drawH = W / imageRatio;

            }else{

                drawH = H;
                drawW = H * imageRatio;

            }

            const x = (W - drawW) / 2;
            const y = (H - drawH) / 2;

            ctx.drawImage(
                img,
                x,
                y,
                drawW,
                drawH
            );

            pages.push(
                canvas.toDataURL(
                    "image/jpeg",
                    0.82
                )
            );
        }


        loading.innerText =
            "Flipbook तैयार हो रहा है...";


        const flip =
            new St.PageFlip(book,{

                width:600,
                height:900,

                size:"stretch",

                minWidth:280,
                maxWidth:900,

                minHeight:420,
                maxHeight:1350,

                showCover:true,

                mobileScrollSupport:false,

                usePortrait:true,

                maxShadowOpacity:.5,

                flippingTime:650

            });


        flip.loadFromImages(pages);


        start.style.display = "none";


    }catch(error){

        loading.innerText =
            "Error: " + error.message;

        console.error(error);

    }

});

</script>

</body>
</html>
